; Vitalis room sensor node (ESP32 DevKit v1 / ESP32-WROOM-32)
;
;   pio run -e esp32dev -t upload       real sensors
;   pio run -e esp32dev-sim -t upload   no sensors attached, sends simulated readings
;   pio device monitor

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:esp32dev]

[env:esp32dev-sim]
build_flags = -D SIMULATE_SENSORS=1
